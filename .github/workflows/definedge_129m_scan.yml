name: Definedge 129m FUT Scanner

on:
  schedule:
    # Pre-shifted early trigger (01:30 UTC) to offset GitHub's ~4.5h cron backlog so the job wakes up before 11:24 AM IST
    - cron: '30 1 * * 1-5'
    # Candle 1 Close (09:15-11:24) -> 11:25 IST / 05:55 UTC
    - cron: '55 5 * * 1-5'
    # Candle 2 Close (11:24-13:33) -> 13:34 IST / 08:04 UTC
    - cron: '4 8 * * 1-5'
    # Candle 3 Close (13:33-15:40) -> 15:41 IST / 10:11 UTC
    - cron: '11 10 * * 1-5'
  workflow_dispatch:

# Prevents duplicate runs from overlapping if a job is already waiting for the next bar close
concurrency:
  group: definedge-129m-intraday-scanner
  cancel-in-progress: false

jobs:
  run-129m-fut-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pyintegrate pyotp pandas numpy tabulate pytz requests

      - name: Run 129m Definedge Scanner
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -f "definedge_129m_fut_scanner.py" ]; then
            python definedge_129m_fut_scanner.py
          elif [ -f "definedge_129m_scanner.py" ]; then
            python definedge_129m_scanner.py
          else
            echo "Error: Neither definedge_129m_fut_scanner.py nor definedge_129m_scanner.py was found!"
            exit 1
          fi
