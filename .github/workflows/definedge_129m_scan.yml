name: Definedge 129m 4-Bar Scanner

on:
  schedule:
    # Runs at 15:41 IST (10:11 UTC) Monday-Friday, right after the 3:40 PM F&O close
    - cron: '11 10 * * 1-5'
  workflow_dispatch:

jobs:
  run-129m-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pyintegrate pyotp pandas numpy tabulate pytz requests

      - name: Run 129-Min Scanner
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python definedge_129m_scanner.py
