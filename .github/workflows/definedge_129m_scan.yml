# 129m Compression + 15m SuperTrend Sniper (Multi-Cron Relay + Stay-Awake Clock)
name: Definedge 129m Compression + 15m ST Sniper

on:
  schedule:
    # Morning Session Wake-Up Crons (07:45 AM to 09:15 AM IST) - Defeats GitHub Cron Lag
    - cron: '15,30,45 2 * * 1-5'
    - cron: '0,15,30,45 3 * * 1-5'
    # Afternoon Relay Wake-Up Crons (12:00 PM to 01:15 PM IST)
    - cron: '30,45 6 * * 1-5'
    - cron: '0,15,30,45 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: definedge-129m-intraday-scanner
  cancel-in-progress: false

jobs:
  run-129m-st-sniper:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore 129m_memory.json from memory-state branch
        run: |
          git fetch origin memory-state:memory-state || true
          git checkout memory-state -- 129m_memory.json 2>/dev/null || true

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pyintegrate pyotp pandas numpy tabulate pytz requests

      - name: Run Stay-Awake Market Clock Scanner
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -f "definedge_129m_fut_scanner.py" ]; then
            python definedge_129m_fut_scanner.py
          else
            echo "❌ definedge_129m_fut_scanner.py not found!"
            exit 1
          fi

      - name: Final Sync of 129m_memory.json to memory-state branch
        if: always()
        run: |
          if [ -f "129m_memory.json" ]; then
            cp 129m_memory.json /tmp/129m_memory.json
            git config user.name "balanisuresh78"
            git config user.email "balanisuresh@gmail.com"
            git checkout -B memory-state
            cp /tmp/129m_memory.json 129m_memory.json
            git add 129m_memory.json
            git commit -m "Update 129m_memory.json" || true
            git push -f origin memory-state
          fi
