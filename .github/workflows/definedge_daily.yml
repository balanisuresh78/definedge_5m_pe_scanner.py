name: Definedge Daily FUT Scanner

on:
  schedule:
    # Daily close (15:30) -> Runs at 15:31 IST / 10:01 UTC
    - cron: '1 10 * * 1-5'
  workflow_dispatch:

jobs:
  run-daily-fut-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@main

      - name: Set Up Python 3.11
        uses: actions/setup-python@main
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pyintegrate pyotp pandas numpy tabulate pytz

      - name: Run Daily Definedge Scanner
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [ -f "definedge_daily_fut_scanner.py" ]; then
            python definedge_daily_fut_scanner.py
          else
            echo "Error: definedge_daily_fut_scanner.py not found!"
            exit 1
          fi
