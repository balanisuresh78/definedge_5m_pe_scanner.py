name: Definedge 5m Stock PE Scanner

on:
  schedule:
    # 09:15 - 09:25 IST (03:45 - 03:55 UTC)
    - cron: '45,50,55 3 * * 1-5'
    # 09:30 - 15:25 IST (04:00 - 09:55 UTC every 5 minutes)
    - cron: '*/5 4-9 * * 1-5'
    # 15:30 - 15:35 IST Market Close (10:00 - 10:05 UTC)
    - cron: '0,5 10 * * 1-5'
  workflow_dispatch:

jobs:
  run-5m-pe-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@main

      - name: Set Up Python 3.11
        uses: actions/setup-python@main
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install integrate pyotp pandas numpy tabulate pytz

      - name: Run 5m Definedge PE Scanner
        env:
          DEFINEDGE_API_TOKEN: ${{ secrets.DEFINEDGE_API_TOKEN }}
          DEFINEDGE_API_SECRET: ${{ secrets.DEFINEDGE_API_SECRET }}
          DEFINEDGE_TOTP_SECRET: ${{ secrets.DEFINEDGE_TOTP_SECRET }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [ -f "definedge_5m_pe_scanner.py" ]; then
            python definedge_5m_pe_scanner.py
          else
            SCRIPT=$(ls *.py | head -n 1)
            echo "Executing Python file: $SCRIPT"
            python "$SCRIPT"
          fi
