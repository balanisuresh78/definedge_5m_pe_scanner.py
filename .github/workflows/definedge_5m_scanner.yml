name: Definedge 77m Stock PE Scanner

on:
  schedule:
    # Candle 1 (09:15-10:32) -> Runs at 10:33 IST / 05:03 UTC
    - cron: '3 5 * * 1-5'
    # Candle 2 (10:32-11:49) -> Runs at 11:50 IST / 06:20 UTC
    - cron: '20 6 * * 1-5'
    # Candle 3 (11:49-13:06) -> Runs at 13:07 IST / 07:37 UTC
    - cron: '37 7 * * 1-5'
    # Candle 4 (13:06-14:23) -> Runs at 14:24 IST / 08:54 UTC
    - cron: '54 8 * * 1-5'
    # Candle 5 (14:23-15:30) -> Runs at 15:31 IST / 10:01 UTC
    - cron: '1 10 * * 1-5'
  workflow_dispatch:

jobs:
  run-77m-pe-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@main

      - name: Set Up Python 3.11
        uses: actions/setup-python@main
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pyintegrate pyotp pandas numpy tabulate pytz

      - name: Run 77m Definedge PE Scanner
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [ -f "definedge_77m_pe_scanner.py" ]; then
            python definedge_77m_pe_scanner.py
          else
            SCRIPT=$(ls *.py | head -n 1)
            echo "Executing Python file: $SCRIPT"
            python "$SCRIPT"
          fi
