name: Definedge 30m FUT Scanner

on:
  schedule:
    # Runs at :16 and :46 UTC from 04:00 to 09:00 UTC
    # Equivalent to 09:46, 10:16, 10:46, 11:16, 11:46, 12:16, 12:46, 13:16, 13:46, 14:16, 14:46, 15:16 IST
    - cron: '16,46 4-9 * * 1-5'
    # Final 30m scan of the day at 15:40 IST (10:10 UTC) — hard stop after this
    - cron: '10 10 * * 1-5'
  workflow_dispatch:

# Prevents overlapping 30m runs from stacking up in the queue
concurrency:
  group: definedge-30m-intraday-scanner
  cancel-in-progress: true

jobs:
  run-30m-fut-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pyintegrate pyotp pandas numpy tabulate pytz requests

      - name: Run 30m Definedge Scanner
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          DEFINEDGE_API_TOKEN: ${{ secrets.DEFINEDGE_API_TOKEN }}
          DEFINEDGE_API_SECRET: ${{ secrets.DEFINEDGE_API_SECRET }}
          DEFINEDGE_TOTP_SECRET: ${{ secrets.DEFINEDGE_TOTP_SECRET }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -f "definedge_30m_fut_scanner.py" ]; then
            python definedge_30m_fut_scanner.py
          elif [ -f "scanner_30m.py" ]; then
            python scanner_30m.py
          else
            SCRIPT=$(ls *30m*.py 2>/dev/null | head -n 1)
            if [ -n "$SCRIPT" ]; then
              python "$SCRIPT"
            else
              echo "Error: 30m scanner python file not found! Update the filename in the YAML."
              exit 1
            fi
          fi
