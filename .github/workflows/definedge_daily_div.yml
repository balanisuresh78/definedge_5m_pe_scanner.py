name: Definedge Daily Divergence Scanner

on:
  schedule:
    # Runs at 15:41 IST / 10:11 UTC (After CAS and F&O market close)
    - cron: '11 10 * * 1-5'
  workflow_dispatch:

jobs:
  run-daily-div-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@main

      - name: Set Up Python 3.11
        uses: actions/setup-python@main
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pyintegrate pyotp pandas numpy tabulate pytz requests

      - name: Run Daily Divergence Scanner
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [ -f "definedge_daily_div_scanner.py" ]; then
            python definedge_daily_div_scanner.py
          else
            echo "Error: definedge_daily_div_scanner.py not found!"
            exit 1
          fi
