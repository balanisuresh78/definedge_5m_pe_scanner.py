name: Definedge 129m FUT Scanner

on:
  schedule:
    # 11:25 IST (05:55 UTC)
    - cron: '55 5 * * 1-5'
    # 13:34 IST (08:04 UTC)
    - cron: '4 8 * * 1-5'
    # 15:31 IST (10:01 UTC)
    - cron: '1 10 * * 1-5'
  workflow_dispatch:

jobs:
  run-129m-fut-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@main

      - name: Set Up Python 3.11
        uses: actions/setup-python@main
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pyintegrate pyotp pandas numpy tabulate pytz

      - name: Run 129m Definedge Scanner
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [ -f "definedge_129m_fut_scanner.py" ]; then
            python definedge_129m_fut_scanner.py
          else
            echo "Error: definedge_129m_fut_scanner.py not found!"
            exit 1
          fi
