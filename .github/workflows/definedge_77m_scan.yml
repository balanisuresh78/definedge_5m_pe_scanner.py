name: Definedge 77m 5-Bar FUT Scanner

on:
  schedule:
    # Bar 1 Close (09:15 - 10:32) -> Runs at 10:33 IST / 05:03 UTC
    - cron: '3 5 * * 1-5'
    # Bar 2 Close (10:32 - 11:49) -> Runs at 11:50 IST / 06:20 UTC
    - cron: '20 6 * * 1-5'
    # Bar 3 Close (11:49 - 13:06) -> Runs at 13:07 IST / 07:37 UTC
    - cron: '37 7 * * 1-5'
    # Bar 4 Close (13:06 - 14:23) -> Runs at 14:24 IST / 08:54 UTC
    - cron: '54 8 * * 1-5'
    # Bar 5 Close (14:23 - 15:40) -> Runs at 15:44 IST / 10:14 UTC (staggered 4 mins after 30m stop)
    - cron: '14 10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: definedge-77m-intraday-scanner
  cancel-in-progress: true

jobs:
  run-77m-fut-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pyintegrate pyotp pandas numpy tabulate pytz requests

      - name: Run 77m 5-Bar Definedge Scanner
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          DEFINEDGE_API_TOKEN: ${{ secrets.DEFINEDGE_API_TOKEN }}
          DEFINEDGE_API_SECRET: ${{ secrets.DEFINEDGE_API_SECRET }}
          DEFINEDGE_TOTP_SECRET: ${{ secrets.DEFINEDGE_TOTP_SECRET }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python definedge_77m_fut_scanner.py
