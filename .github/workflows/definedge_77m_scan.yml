name: Definedge 77m Compression + 15m ST Sniper

on:
  schedule:
    # 15-Minute Sniper Triggers (staggered 2 mins after 15m bar closes to avoid 30m scanner collisions)
    # Covers 09:32, 09:47, 10:02, 10:17 ... up to 15:32 IST
    - cron: '2,17,32,47 4-9 * * 1-5'
    - cron: '2 10 * * 1-5'
    # Exact 77-Minute Harvester Triggers (10:33, 11:50, 13:07, 14:24, 15:44 IST)
    - cron: '3 5 * * 1-5'
    - cron: '20 6 * * 1-5'
    - cron: '37 7 * * 1-5'
    - cron: '54 8 * * 1-5'
    - cron: '14 10 * * 1-5'
  workflow_dispatch:

# Allows GitHub Actions to auto-create and update 77m_memory.json in your repo
permissions:
  contents: write

concurrency:
  group: definedge-77m-intraday-scanner
  cancel-in-progress: true

jobs:
  run-77m-st-sniper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pyintegrate pyotp pandas numpy tabulate pytz requests

      - name: Run 77m Harvester & 15m ST(10,2) Sniper
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python definedge_77m_fut_scanner.py

      - name: Save Updated 77m_memory.json to Repository
        run: |
          if [ -f "77m_memory.json" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add 77m_memory.json
            if ! git diff --staged --quiet; then
              git commit -m "Auto-update 77m_memory.json [skip ci]"
              git pull --rebase origin "${GITHUB_REF_NAME}" || true
              git push origin HEAD:"${GITHUB_REF_NAME}"
            else
              echo "No changes to 77m_memory.json."
            fi
          fi
